<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Nuria learning loop</title>
  <desc id="description">Recorded experience enters the spiking circuit and memory. The hybrid policy chooses an action. Measured outcomes feed learning. Experimental resources are virtual; treasury signing is unconnected.</desc>
  <rect width="1200" height="380" rx="12" fill="#0d0f10"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="62" fill="#eef0e8" font-size="25">Experience becomes state. Outcomes change what comes next.</text>
    <text x="48" y="91" fill="#9aa5a0" font-size="14">A persistent, inspectable learning loop</text>
    <g stroke="#2a3230" fill="#131817">
      <rect x="48" y="135" width="244" height="140" rx="8"/>
      <rect x="334" y="135" width="244" height="140" rx="8"/>
      <rect x="620" y="135" width="244" height="140" rx="8"/>
      <rect x="906" y="135" width="244" height="140" rx="8"/>
    </g>
    <g fill="#b8d4a7" font-size="11" letter-spacing="1.5">
      <text x="70" y="164">EXPERIENCE</text><text x="356" y="164">STATE</text><text x="642" y="164">CHOICE</text><text x="928" y="164">FEEDBACK</text>
    </g>
    <g fill="#eef0e8" font-size="20">
      <text x="70" y="202">Recorded inputs</text><text x="356" y="202">Circuit + memory</text><text x="642" y="202">Hybrid policy</text><text x="928" y="202">Measured outcomes</text>
    </g>
    <g fill="#a0aaa5" font-size="13">
      <text x="70" y="231">Source, time and evidence</text><text x="356" y="231">Spikes, forecasts, episodes</text><text x="642" y="231">Scores and action records</text><text x="928" y="231">Reward, cost and learning</text>
      <text x="70" y="251">Finalized trades when connected</text><text x="356" y="251">Persistent checkpoints</text><text x="642" y="251">Goals + neural activity</text><text x="928" y="251">Paired experimental controls</text>
    </g>
    <g stroke="#788d78" stroke-width="1.5" fill="none">
      <path d="M292 205H334M578 205H620M864 205H906"/>
      <path d="M1028 275V312H456V275"/>
      <circle cx="313" cy="205" r="3" fill="#b8d4a7"/><circle cx="599" cy="205" r="3" fill="#b8d4a7"/><circle cx="885" cy="205" r="3" fill="#b8d4a7"/>
    </g>
    <text x="48" y="351" fill="#78857e" font-size="12">Current experimental resources are virtual. Live mint, fee wallet and financial signing remain unconnected.</text>
  </g>
</svg>
