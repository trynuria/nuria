<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="commission-title commission-desc">
  <title id="commission-title">Commissioning workflow</title>
  <desc id="commission-desc">A recorded decision commits a task and cost ceiling. Buyer-owned checks establish delivery quality, and independent onchain evidence establishes payment. Both records are required for a measured outcome. External hiring remains gated.</desc>
  <rect width="800" height="390" rx="12" fill="#0a0d0c"/>
  <g font-family="Arial, sans-serif">
    <text x="26" y="35" fill="#e2e8e2" font-size="21">Commissioning workflow</text>
    <g fill="#111814" stroke="#2c3930"><rect x="26" y="60" width="354" height="110" rx="7"/><rect x="420" y="60" width="354" height="110" rx="7"/><rect x="26" y="208" width="354" height="110" rx="7"/><rect x="420" y="208" width="354" height="110" rx="7"/></g>
    <g stroke="#59745c" fill="none"><path d="M380 115H420M597 170V189H203V208M380 263H420"/></g>
    <g fill="#dce7dc" font-size="18"><text x="44" y="89">Recorded decision</text><text x="438" y="89">Committed task</text><text x="44" y="237">Delivery and payment checks</text><text x="438" y="237">Measured outcome</text></g>
    <g fill="#96a297" font-size="15"><text x="44" y="116">Fresh action and decision hash</text><text x="44" y="142">A local proposal, without spending</text><text x="438" y="116">Offer, dataset and cost ceiling</text><text x="438" y="142">Persist before sending · no blind retries</text><text x="44" y="264">Artifact checked against held-out targets</text><text x="44" y="290">Exact finalized payment verified separately</text><text x="438" y="264">Task improvement minus committed cost</text><text x="438" y="290">Retain useful results and failures</text></g>
    <path d="M26 340H774" stroke="#2c3930"/>
    <text x="26" y="365" fill="#96a297" font-size="14">Prepared controller · external hiring is gated · no consciousness result is implied</text>
  </g>
</svg>
