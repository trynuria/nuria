name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt ruff==0.16.10
          npm ci
      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -v
      - name: Check frontend
        run: |
          npm run format:check
          npm run check:frontend
          npm run build
          git diff --exit-code -- index.html docs-script-check.js
      - name: Check isolated Solana payment SDK
        run: |
          python -m venv .commerce-venv
          .commerce-venv/bin/python -m pip install -r commerce/requirements.lock
          .commerce-venv/bin/python -m unittest discover -s commerce/tests -v
      - name: Check managed custody SDK
        working-directory: commerce/signer
        run: |
          npm ci --ignore-scripts
          node --check privy.mjs
          node --test custody-policy.test.mjs request-input.test.mjs
