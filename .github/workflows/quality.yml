name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt ruff==0.16.10
          npm ci
      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
          python -m scripts.check_publication
          python -m unittest discover -s tests -v
          python -m scripts.verify_semantic_wiring
          python research/hybrid-agent/comparison-03/extract_evidence.py --output "$RUNNER_TEMP/nuria-comparison-03-evidence"
          python -m scripts.verify_grounded_comparison "$RUNNER_TEMP/nuria-comparison-03-evidence/run" --protocol "$RUNNER_TEMP/nuria-comparison-03-evidence/evidence/protocol.json" --source-freeze "$RUNNER_TEMP/nuria-comparison-03-evidence/evidence/source-freeze.json" --source-freeze-sha256 a4cff862bda1b3f7136726106f468e5f8153af0372f5cbe437bc3c37965fe342 --output "$RUNNER_TEMP/nuria-comparison-03-verification.json"
          python -m unittest discover -s research/hybrid-agent/supplemental-controls -p test_controls.py -v
          python research/hybrid-agent/supplemental-controls/input_equivalence.py .
          python research/hybrid-agent/supplemental-controls/results-01/verify_results.py --package research/hybrid-agent/supplemental-controls/results-01 --repository . --workspace "$RUNNER_TEMP/nuria-simple-controls" --output "$RUNNER_TEMP/nuria-simple-controls.json"
          python -m unittest discover -s research/hybrid-agent/supplemental-controls/results-01 -p test_results.py -v
          python -m unittest discover -s research/hybrid-agent/work-snapshot -p test_recent_work.py -v
          python research/hybrid-agent/work-snapshot/check_recent_work.py
          python research/hybrid-agent/work-trials/verify_work_trials.py --repository . --workspace "$RUNNER_TEMP/nuria-work-trials" --output "$RUNNER_TEMP/nuria-work-trials.json"
          python -m unittest discover -s research/hybrid-agent/work-trials -p test_work_trials.py -v
          python research/hybrid-agent/weight-delta/verify_weight_delta.py --work-evidence research/hybrid-agent/work-trials
          python -m unittest discover -s research/hybrid-agent/weight-delta -p test_weight_delta.py -v
          python research/analytical-skills/challenge-01/verify.py --repository . --workspace "$RUNNER_TEMP/nuria-report-transfer" --output "$RUNNER_TEMP/nuria-report-transfer.json"
          python -m unittest discover -s research/analytical-skills/challenge-01 -p test_package.py -v
          python -m scripts.verify_analytical_report_lifecycle --repository . --workspace "$RUNNER_TEMP/nuria-report-lifecycle" --output "$RUNNER_TEMP/nuria-report-lifecycle.json"
          python research/adaptive-reasoning/results-01/replay.py --workspace "$RUNNER_TEMP/nuria-hosted-reasoning" --output "$RUNNER_TEMP/nuria-hosted-reasoning.json"
          python -m unittest discover -s research/adaptive-reasoning/results-01 -p 'test_*.py' -v
          python -m scripts.extract_workflow_evidence --evidence research/workflow-reasoning/results-01 --workspace "$RUNNER_TEMP/nuria-workflow-evidence"
          python -m scripts.verify_workflow_course --repository . --results "$RUNNER_TEMP/nuria-workflow-evidence" --replay-workspace "$RUNNER_TEMP/nuria-workflow-replay"
          python -m scripts.check_action_loop .test-state/action-integration .test-state/action-integration.json
          python -m scripts.verify_adaptive_memory research/adaptive-memory/validation --replay-environment
          python -m scripts.verify_intervention_memory research/intervention-memory/validation
          python -m scripts.verify_skill_results research/skill-acquisition/development-01
          python -m scripts.verify_skill_expression_results research/skill-acquisition/expression-development-02
          python -m scripts.verify_skill_retention research/skill-acquisition/retention-reserved
          python -m scripts.check_neural_digit_results research/neural-digits
          python -m scripts.verify_text_abstraction_results
          python research/verified-memory/verify_release.py
          python research/verified-memory/verify_attempts.py
      - name: Check frontend
        run: |
          npm run format:check
          npm run check:frontend
          npm run build
          git diff --exit-code -- index.html docs-script-check.js
      - name: Check isolated Solana payment SDK
        run: |
          python -m venv .commerce-venv
          .commerce-venv/bin/python -m pip install -r commerce/requirements.lock
          .commerce-venv/bin/python -m unittest discover -s commerce/tests -v
      - name: Check managed custody SDK
        working-directory: commerce/signer
        run: |
          npm ci --ignore-scripts
          node --check privy.mjs
          node --test custody-policy.test.mjs request-input.test.mjs
  multiscale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install isolated scientific dependencies
        run: python -m pip install -r research/multiscale/requirements.txt
      - name: Check coupling and joint recovery
        run: python -m unittest discover -s tests -p test_multiscale.py -v
      - name: Reconstruct retained comparison scores
        run: python -m scripts.verify_multiscale_results research/multiscale/results
  biology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install isolated NWB reader
        run: python -m pip install -r requirements.txt -r research/biology/requirements.txt
      - name: Check pinned public acquisition and original NWB import
        run: |
          python -m scripts.dandi_replay download "$RUNNER_TEMP/nuria-dandi"
          NURIA_DANDI_NWB="$RUNNER_TEMP/nuria-dandi/human-HO3.nwb" python -m unittest tests.test_nwb_spikes -v
          python -m scripts.dandi_replay verify research/biology/dandi-01/binned.json research/biology/dandi-01/result.json
